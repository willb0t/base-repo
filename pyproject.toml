[build-system]
requires = ["setuptools>=69.0.2", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-gitlab-deployment"
version = "1.0.0"
description = "Infrastructure-as-Code repository for deploying GitLab CE on VMware vSphere or Proxmox using Terraform and Ansible"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Infrastructure Team", email = "infrastructure@example.com"}
]
maintainers = [
    {name = "Infrastructure Team", email = "infrastructure@example.com"}
]
keywords = [
    "infrastructure-as-code",
    "terraform",
    "ansible",
    "gitlab",
    "vmware",
    "proxmox",
    "automation",
    "devops"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
]
requires-python = ">=3.9"
dependencies = [
    "ansible>=8.5.0",
    "ansible-core>=2.15.5",
    "boto3>=1.34.0",
    "pyvmomi>=8.0.2.0.1",
    "proxmoxer>=2.0.1",
    "cryptography>=41.0.8",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    "requests>=2.31.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "pylint>=3.0.3",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "pre-commit>=3.6.0",
]
tools = [
    "terraform-docs>=0.16.0",
    "ansible-runner>=2.3.4",
    "testinfra>=10.1.0",
    "checkov>=3.1.34",
    "terrascan>=1.18.11",
    "tfsec>=1.28.4",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=1.3.0",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.8",
]
all = [
    "iac-gitlab-deployment[dev,tools,docs]"
]

[project.urls]
Homepage = "https://github.com/your-org/iac-gitlab-deployment"
Documentation = "https://github.com/your-org/iac-gitlab-deployment/blob/main/README.md"
Repository = "https://github.com/your-org/iac-gitlab-deployment.git"
Issues = "https://github.com/your-org/iac-gitlab-deployment/issues"
Changelog = "https://github.com/your-org/iac-gitlab-deployment/blob/main/CHANGELOG.md"

[project.scripts]
setup-python-env = "scripts.setup_python_env:main"
manage-vault = "scripts.manage_vault:main"
load-vault-env = "scripts.load_vault_env:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "ansible*", "terraform*", "docs*"]
exclude = ["tests*", "*.tests*", "*.tests.*", "tests.*"]

[tool.setuptools.package-data]
"*" = [
    "*.yml",
    "*.yaml",
    "*.tf",
    "*.tfvars",
    "*.md",
    "*.sh",
    "*.j2",
    "*.tpl",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | \.terraform
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["scripts"]
known_third_party = ["ansible", "boto3", "click", "cryptography", "jinja2", "proxmoxer", "pyvmomi", "requests", "rich", "yaml"]

# Flake8 configuration
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".terraform",
    "build",
    "dist",
    "*.egg-info",
]

# Pylint configuration
[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 88

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ansible.*",
    "boto3.*",
    "botocore.*",
    "proxmoxer.*",
    "pyvmomi.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["scripts"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/.venv/*",
    "*/venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit security linter configuration
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", ".terraform"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection_process_args

# Safety configuration
[tool.safety]
ignore = []
