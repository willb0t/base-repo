---
- name: Update system packages
  apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  register: apt_update_result

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - unzip
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - python3
      - python3-pip
      - openssh-server
      - ufw
      - fail2ban
      - logrotate
      - rsyslog
      - ntp
    state: present

- name: Configure timezone
  timezone:
    name: UTC

- name: Configure NTP
  service:
    name: ntp
    state: started
    enabled: true

- name: Configure SSH security
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
  notify: restart ssh

- name: Configure UFW firewall
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"    # SSH
    - "80"    # HTTP
    - "443"   # HTTPS
  notify: enable ufw

- name: Configure fail2ban for SSH
  copy:
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 3600
      findtime = 600
    dest: /etc/fail2ban/jail.local
    backup: true
  notify: restart fail2ban

- name: Configure automatic security updates
  copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    backup: true

- name: Configure logrotate for GitLab logs
  copy:
    content: |
      /var/log/gitlab/*/*.log {
          daily
          missingok
          rotate 52
          compress
          delaycompress
          notifempty
          create 644 git git
          postrotate
              /usr/bin/gitlab-ctl hup nginx 2> /dev/null || true
              /usr/bin/gitlab-ctl restart gitlab-workhorse 2> /dev/null || true
          endscript
      }
    dest: /etc/logrotate.d/gitlab
    backup: true

- name: Set system limits for GitLab
  pam_limits:
    domain: "{{ item.domain }}"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { domain: 'git', type: 'soft', item: 'nofile', value: '65536' }
    - { domain: 'git', type: 'hard', item: 'nofile', value: '65536' }
    - { domain: 'git', type: 'soft', item: 'nproc', value: '65536' }
    - { domain: 'git', type: 'hard', item: 'nproc', value: '65536' }

- name: Configure kernel parameters for GitLab
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: 'kernel.sem', value: '250 32000 32 262' }
    - { name: 'kernel.shmmax', value: '68719476736' }
    - { name: 'kernel.shmall', value: '4294967296' }
    - { name: 'net.core.somaxconn', value: '1024' }
    - { name: 'vm.overcommit_memory', value: '2' }
    - { name: 'vm.overcommit_ratio', value: '80' }

- name: Ensure system is ready for GitLab installation
  debug:
    msg: "System preparation completed successfully"
