#cloud-config
hostname: ${vm_hostname}
fqdn: ${vm_hostname}.${vm_domain}
manage_etc_hosts: true

# User configuration
users:
  - name: ${ssh_username}
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ${ssh_public_key}
    lock_passwd: true

# Package updates and installations
package_update: true
package_upgrade: true
packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - unzip
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - python3
  - python3-pip
  - openssh-server

# SSH configuration
ssh_pwauth: false
disable_root: true
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]

# System configuration
timezone: UTC
locale: en_US.UTF-8

# Security updates
unattended_upgrades:
  enable: true

# Firewall configuration
runcmd:
  - systemctl enable ssh
  - systemctl start ssh
  - ufw --force enable
  - ufw allow ssh
  - ufw allow http
  - ufw allow https
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - echo "Cloud-init setup completed" > /var/log/cloud-init-complete.log

# Final message
final_message: "The system is finally up, after $UPTIME seconds"

# Power state
power_state:
  mode: reboot
  condition: true
